<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Course - LMS Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="manage" data-auth="admin">
  <nav class="navbar" id="navbar"></nav>

  <div class="container" style="max-width:750px;">
    <div class="page-header">
      <h1>Add New Course</h1>
      <p>Fill in the details below to publish a new course</p>
    </div>

    <form id="courseForm" onsubmit="return validateCourseForm(event)" novalidate style="background:var(--card);padding:26px;border-radius:var(--radius);border:1px solid var(--border);">
      <div class="form-group">
        <label>Course Title</label>
        <input type="text" id="title" name="title" placeholder="e.g. Complete JavaScript Course">
        <div class="error-text" id="titleError"></div>
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" id="category" name="category" placeholder="e.g. Development, Design, Marketing">
        <div class="error-text" id="categoryError"></div>
      </div>
      <div class="form-group">
        <label>Instructor Name</label>
        <input type="text" id="instructor" name="instructor" placeholder="e.g. Jane Smith">
        <div class="error-text" id="instructorError"></div>
      </div>
      <div class="form-group">
        <label>Price (USD)</label>
        <input type="number" id="price" name="price" min="0" placeholder="e.g. 49">
        <div class="error-text" id="priceError"></div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="description" name="description" placeholder="What will students learn in this course?"></textarea>
        <div class="error-text" id="descriptionError"></div>
      </div>

      <div class="form-group">
        <label>Course Modules</label>
        <div id="modulesWrap">
          <div style="display:flex;gap:8px;margin-bottom:8px;">
            <input type="text" id="module1" name="module1" placeholder="Module 1 title" value="Introduction">
          </div>
          <div class="error-text" id="module1Error"></div>
          <div style="display:flex;gap:8px;margin-bottom:8px;">
            <input type="text" name="module2" placeholder="Module 2 title" value="Getting Started">
          </div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="addModuleBtn">+ Add Module</button>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Publish Course</button>
    </form>
  </div>

  <script src="js/data.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/validation.js"></script>
  <script>
    let extraModuleCount = 2;
    document.getElementById('addModuleBtn').addEventListener('click', function () {
      extraModuleCount++;
      const row = document.createElement('div');
      row.style = 'display:flex;gap:8px;margin-bottom:8px;';
      row.innerHTML = `<input type="text" name="module${extraModuleCount}" placeholder="Module ${extraModuleCount} title">
        <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">✕</button>`;
      document.getElementById('modulesWrap').appendChild(row);
    });
  </script>
</body>
</html>
