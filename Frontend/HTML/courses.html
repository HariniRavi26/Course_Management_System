<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Courses - LMS Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="manage" data-auth="admin">
  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h1>Manage Courses</h1>
        <p>Add, edit, or remove courses from your portal</p>
      </div>
      <a href="add-course.html" class="btn btn-primary">+ Add New Course</a>
    </div>

    <table>
      <thead>
        <tr><th>Title</th><th>Category</th><th>Instructor</th><th>Price</th><th>Modules</th><th>Actions</th></tr>
      </thead>
      <tbody id="courseTableBody"></tbody>
    </table>
  </div>

  <script src="js/data.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    function render() {
      const courses = getCourses();
      const body = document.getElementById('courseTableBody');
      if (!courses.length) {
        body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);">No courses found.</td></tr>';
        return;
      }
      body.innerHTML = courses.map(c => `
        <tr>
          <td><b>${c.title}</b></td>
          <td>${c.category}</td>
          <td>${c.instructor}</td>
          <td>$${c.price}</td>
          <td>${c.modules.length}</td>
          <td>
            <a href="course-details.html?id=${c.id}" class="btn btn-secondary btn-sm">View</a>
            <a href="edit-course.html?id=${c.id}" class="btn btn-primary btn-sm">Edit</a>
            <button class="btn btn-danger btn-sm" onclick="removeCourse('${c.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }
    function removeCourse(id) {
      if (confirm('Are you sure you want to delete this course? This cannot be undone.')) {
        deleteCourse(id);
        render();
      }
    }
    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
