<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - LMS Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register" data-auth="public">
  <nav class="navbar" id="navbar"></nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="sub">Sign up to start learning today</p>

      <form id="registerForm" action="student-dashboard.html" method="get" onsubmit="return validateRegisterForm(event)" novalidate>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe">
          <div class="error-text" id="nameError"></div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
          <div class="error-text" id="emailError"></div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters">
          <div class="error-text" id="passwordError"></div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
          <div class="error-text" id="confirmPasswordError"></div>
        </div>
        <div class="form-group">
          <label>I am registering as</label>
          <select id="role" name="role">
            <option value="student">Student</option>
            <option value="admin">Admin / Instructor</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <div class="switch">Already have an account? <a href="login.html">Login here</a></div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
