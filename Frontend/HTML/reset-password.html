<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password - LMS Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reset" data-auth="public">
  <nav class="navbar" id="navbar"></nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Reset Password</h2>
      <p class="sub">Create a new password for your account</p>

      <div class="alert alert-success">Email verified! Set a new password below.</div>

      <form id="resetForm" action="login.html" method="get" onsubmit="return validateResetForm(event)" novalidate>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
          <div class="error-text" id="emailError"></div>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters">
          <div class="error-text" id="passwordError"></div>
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
          <div class="error-text" id="confirmPasswordError"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
      </form>
      <script>
        // Carry the email through from forgot-password.html?email=...
        var qp = new URLSearchParams(window.location.search);
        if (qp.get('email')) document.getElementById('email').value = qp.get('email');
      </script>

      <div class="switch"><a href="login.html">Back to Login</a></div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
