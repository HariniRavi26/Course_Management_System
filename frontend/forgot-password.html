<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password - LMS Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="forgot" data-auth="public">
  <nav class="navbar" id="navbar"></nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Forgot Password</h2>
      <p class="sub">Enter your email and we'll help you reset it</p>

      <form id="forgotForm" action="reset-password.html" method="get" onsubmit="return validateForgotForm(event)" novalidate>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
          <div class="error-text" id="emailError"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>

      <div class="switch"><a href="login.html">Back to Login</a></div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
