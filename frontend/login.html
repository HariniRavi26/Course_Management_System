<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - LMS Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" data-auth="public">
  <nav class="navbar" id="navbar"></nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="sub">Login to continue learning</p>

      <div class="alert alert-info" style="font-size:13px;">
        Demo logins — Student: <b>student@lms.com / student123</b><br>Admin: <b>admin@lms.com / admin123</b>
      </div>

      <form id="loginForm" action="student-dashboard.html" method="get" onsubmit="return validateLoginForm(event)" novalidate>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
          <div class="error-text" id="emailError"></div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" name="password" placeholder="Your password">
          <div class="error-text" id="passwordError"></div>
        </div>
        <div style="text-align:right;margin-bottom:16px;">
          <a href="forgot-password.html" style="font-size:13px;color:var(--primary);">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <div class="switch">Don't have an account? <a href="register.html">Register here</a></div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
